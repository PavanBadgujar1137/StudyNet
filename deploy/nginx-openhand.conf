# OpenHand — put in /etc/nginx/sites-available/openhand.live
# Then: sudo ln -sf /etc/nginx/sites-available/openhand.live /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d openhand.live -d www.openhand.live -d api.openhand.live

# Frontend: openhand.live
server {
    listen 80;
    server_name openhand.live www.openhand.live;

    root /home/buntsapps/websites/StudyNet/frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# Backend API: api.openhand.live -> Node PORT 6000
server {
    listen 80;
    server_name api.openhand.live;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
