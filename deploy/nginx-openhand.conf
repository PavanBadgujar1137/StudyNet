# OpenHand nginx — production + UAT
# sudo cp deploy/nginx-openhand.conf /etc/nginx/sites-available/openhand.live
# sudo ln -sf /etc/nginx/sites-available/openhand.live /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d openhand.live -d www.openhand.live -d api.openhand.live \
#   -d uat.openhand.live -d api-uat.openhand.live

# ── Production frontend: openhand.live ───────────────────────────────────────
server {
    listen 80;
    server_name openhand.live www.openhand.live;

    root /home/ec2-user/StudyNet/frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ── Production API: api.openhand.live -> PM2 openhand-api :6000 ──────────────
server {
    listen 80;
    server_name api.openhand.live;

    client_max_body_size 50G;
    client_body_timeout 14400s;
    # Stream large uploads directly to Node — prevents buffer overflow on 10h videos
    client_body_buffer_size 128k;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, x-auth-token' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;
        proxy_connect_timeout 300s;
        # Stream body to Node — do not buffer the entire file in Nginx
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}

# ── UAT frontend: uat.openhand.live ──────────────────────────────────────────
server {
    listen 80;
    server_name uat.openhand.live;

    root /home/ec2-user/StudyNet/frontend/build-uat;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

