# OpenHand API only (Amazon Linux uses conf.d)
# UAT :4000 | Production :6000
# HTTPS (Certbot) blocks MUST also have the same body size + timeouts,
# or use deploy/nginx-upload-limit.conf in conf.d (applies to all servers).

server {
    listen 80;
    server_name api.openhand.live;

    client_max_body_size 50G;
    client_body_timeout 14400s;

    location / {
        client_max_body_size 50G;
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;
        proxy_connect_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

